name: medexplain_mobile
description: MedExplain Mobile - Healthcare Companion App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  http: ^1.1.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  table_calendar: ^3.0.0
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
